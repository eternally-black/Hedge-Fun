name: canary
# Settlement canary: exercises the live Polymarket Gamma integration (fetchBlitzDeck per-category
# horizon, fetchResolution closed=true lookup, mapMarket shapes). Runs on a schedule — NOT per
# deploy — because it hits the real API. A red run = Polymarket API shape/behavior drifted and
# settlement/deck could silently break (the 2026-06-25 "stuck in Awaiting resolution" class).
on:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC
  workflow_dispatch:

# Least privilege: read-only repo contents. Never let two canaries overlap.
permissions:
  contents: read
concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  verify-polymarket:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (tag in the comment); dependabot's github-actions ecosystem
      # bumps both together. A moving tag is whatever its owner pushes next.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:polymarket
      - run: npm run verify:clob
      - name: canary dead-man ping
        if: success()
        run: |
          if [ -n "${{ secrets.CANARY_HC_URL }}" ]; then curl -fsS --max-time 10 -o /dev/null "${{ secrets.CANARY_HC_URL }}"; fi
      - name: canary failure alert
        if: failure()
        run: |
          curl -sS --max-time 10 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🚨 canary: Polymarket integration drifted — check before next deploy"
