name: deploy
on:
  push:
    branches: [main]
  # Build (not deploy) is reachable from a feature branch for PoC measurement.
  # The deploy job is hard-gated to main and receives that run's exact digest.
  workflow_dispatch:

# Never let two deploys overlap; don't cancel an in-flight one mid-build.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Least privilege: read-only repo contents for every job by default. The build job
# overrides with its own `permissions:` to add `packages: write` for GHCR.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Test gate: lint + DB-free unit suite + DB-backed money/economy suite.
  # Must be green before the image is built/pushed (build `needs: test`), so a
  # logic regression in points/settle/referral/streak/cash-gate can't ship.
  # verify:polymarket hits the live API → run it on a schedule, not per-deploy.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hedgefun
          POSTGRES_PASSWORD: hedgefun
          POSTGRES_DB: hedgefun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hedgefun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hedgefun:hedgefun@localhost:5432/hedgefun
    steps:
      # Actions pinned to commit SHAs (tag in the comment); dependabot's github-actions ecosystem
      # bumps both together. A moving tag is whatever its owner pushes next.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            docker/prisma-cli/package-lock.json
      - run: npm ci                 # strict install from lockfile (postinstall = prisma generate)
      - run: npm ci --prefix mobile --ignore-scripts
      - run: npm run lint
      - run: npm run contract:check   # mobile/contract/* must equal src/lib/* (scripts/sync-mobile-contract.ts)
      - run: npm ci                   # the Expo app has its own lockfile and its own deps
        working-directory: mobile
      - run: npx tsc --noEmit         # mobile type-check (no Android SDK needed)
        working-directory: mobile
      - run: npm test               # DB-free units (no DATABASE_URL needed)
      - run: npm run test:mobile
      - run: npm run test:db:run    # DB-backed: cash gate, settle, referral, streak recovery
      - name: Operations contract tests
        run: npm run test:ops
      - name: Production dependency audits
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix mobile --omit=dev --audit-level=high
          npm audit --prefix docker/prisma-cli --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # Build the image on the runner and push to GHCR. The heavy lifting that used
  # to run on the VPS now runs here, with a persistent GHA layer cache.
  # ---------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      revision: ${{ github.sha }}
    permissions:
      contents: read
      packages: write          # push to GHCR using the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/eternally-black/hedge-fun
          # Human/package-browser handle only. Production deploys by the build output digest.
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64      # runner + VPS both amd64; explicit = deterministic, single-arch
          provenance: false           # v6 default attaches a provenance attestation → multi-arch
                                       # image index that plain `docker pull`/compose on the VPS
                                       # can choke on. Off for single-arch.
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_PRIVY_APP_ID=${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
            NEXT_PUBLIC_POLYMARKET_BUILDER_CODE=${{ secrets.NEXT_PUBLIC_POLYMARKET_BUILDER_CODE }}
          # scope pins the cache key so a feature-branch build and the main build
          # SHARE one cache (type=gha otherwise scopes per git ref → the warm-build
          # measurement on the branch wouldn't carry to main).
          cache-from: type=gha,scope=hedgefun-prod
          cache-to: type=gha,scope=hedgefun-prod,mode=max

  # ---------------------------------------------------------------------------
  # Deploy: VPS only logs in, pulls the fresh image, and recreates services.
  # Hard-gated to main so feature-branch / manual builds never deploy.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and run deploy script
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DEPLOY_GIT_SHA: ${{ needs.build.outputs.revision }}
          DEPLOY_IMAGE_REF: ghcr.io/eternally-black/hedge-fun@${{ needs.build.outputs.digest }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # The VPS host key fingerprint (ssh-keyscan -t ed25519 <host> | ssh-keygen -lf -).
          # Empty = no verification, so set the secret.
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          # Pull + up only now (no build on the box) — 10m is plenty.
          command_timeout: 10m
          envs: DEPLOY_GIT_SHA,DEPLOY_IMAGE_REF
          # Fetch and execute deploy.sh from the exact tested commit. The temporary copy remains
          # stable while that script switches the working tree, so bash never continues in a file
          # rewritten by git reset and a newer main push cannot change this release.
          script: |
            set -eu
            case "$DEPLOY_GIT_SHA" in *[!0-9a-f]*|'') exit 64 ;; esac
            case "$DEPLOY_IMAGE_REF" in ghcr.io/eternally-black/hedge-fun@sha256:*) ;; *) exit 64 ;; esac
            [ "${#DEPLOY_GIT_SHA}" -eq 40 ] || exit 64
            cd /opt/hedgefun
            git fetch --no-tags origin "$DEPLOY_GIT_SHA"
            deploy_bootstrap=$(mktemp /tmp/hedgefun-deploy.XXXXXX)
            trap 'rm -f "$deploy_bootstrap"' EXIT
            git show "$DEPLOY_GIT_SHA:deploy.sh" > "$deploy_bootstrap"
            HF_DEPLOY_BOOTSTRAP=1 bash "$deploy_bootstrap" deploy "$DEPLOY_GIT_SHA" "$DEPLOY_IMAGE_REF"

  # ---------------------------------------------------------------------------
  # Failure alert. A failed upstream job SKIPS dependent jobs, so an in-job failure
  # step would never run — this separate `always()` job is the only shape that
  # reports whichever of the three gates actually failed. Also covers test/build
  # failures on a feature-branch workflow_dispatch (deploy is skipped there, not failed).
  # ---------------------------------------------------------------------------
  notify:
    needs: [test, build, deploy]
    if: always() && (needs.test.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Telegram alert on pipeline failure
        run: |
          curl -sS --max-time 10 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🚨 CI: deploy pipeline failed (test=${{ needs.test.result }} build=${{ needs.build.result }} deploy=${{ needs.deploy.result }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
