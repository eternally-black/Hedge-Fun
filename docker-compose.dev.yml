# Local dev Postgres only. Run: docker compose -f docker-compose.dev.yml up -d --wait
# (or `npm run db:up`). Loopback-only publish; throwaway creds. Prod uses docker-compose.yml
# (Postgres stays internal, no host port). This file must never ship to prod.
services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: hedgefun
      POSTGRES_PASSWORD: hedgefun
      POSTGRES_DB: hedgefun
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hedgefun -d hedgefun"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
