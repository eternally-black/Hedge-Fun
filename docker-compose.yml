# HedgeFun production stack. The image is built + pushed to GHCR by CI; prod pulls it.
# One image serves app + migrate + poller. Postgres stays on the internal network only;
# Caddy is the sole public ingress. Env comes from a sibling .env (mode 600, not in git).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    # Bounded logs on EVERY service (not only daemon.json defaults): daemon defaults apply
    # only to newly-created containers, and db is almost never recreated.
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No ports: — never published to the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  # One-shot: apply committed migrations (prisma migrate deploy). Exits 0; app/poller wait on it.
  # The existing db-push database is baselined to 0_init once by deploy.sh (P3005 detection) so
  # this never tries to re-create the live tables.
  migrate:
    image: ghcr.io/eternally-black/hedge-fun:latest
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    logging: *bounded-logs
    restart: "no"

  app:
    image: ghcr.io/eternally-black/hedge-fun:latest
    # build: kept for local-dev / manual fallback only — prod pulls from GHCR (CI builds it).
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID}
    command: ["node", "server.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    logging: *bounded-logs
    # No host port — Caddy reaches app:3000 over the internal network.
    healthcheck:
      # /api/me returns 401 without a token; 401 (or 200) proves the server is alive.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/me | grep -qE '401|200'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m

  poller:
    image: ghcr.io/eternally-black/hedge-fun:latest
    command: ["node", "dist/poller.cjs"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    logging: *bounded-logs
    # Liveness: the poller touches a heartbeat file after each Gamma-bound subsystem succeeds
    # and at the end of each clean tick (scripts/poller.ts beat()).
    # Fail if it's missing or stale — older than 3x the 60s poll interval. NOTE: plain
    # Docker does NOT restart a container on a failing healthcheck (that is Swarm-only) —
    # the unhealthy status is acted on by ops/vps/hedgefun-watchdog.sh (`docker restart`).
    # A negative age (file mtime in the future after a clock jump) is also unhealthy.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e 'const f=process.env.POLLER_HEARTBEAT_FILE||require(\"path\").join(require(\"os\").tmpdir(),\"poller-heartbeat\");const a=Date.now()-require(\"fs\").statSync(f).mtimeMs;process.exit(a>=0&&a<180000?0:1)'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal
    logging: *bounded-logs
    # Admin API answering with a loaded config proves the process is alive AND serving.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
