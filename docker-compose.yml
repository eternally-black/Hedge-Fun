# HedgeFun production stack. The image is built + pushed to GHCR by CI; prod pulls it.
# One image serves app + migrate + poller. Postgres stays on the internal network only;
# Caddy is the sole public ingress. Env comes from a sibling .env (mode 600, not in git).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    # No ports: — never published to the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  # One-shot: apply schema (prisma db push). Exits 0; app/poller wait on it.
  migrate:
    image: ghcr.io/eternally-black/hedge-fun:latest
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  app:
    image: ghcr.io/eternally-black/hedge-fun:latest
    # build: kept for local-dev / manual fallback only — prod pulls from GHCR (CI builds it).
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID}
    command: ["node", "server.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    # No host port — Caddy reaches app:3000 over the internal network.
    healthcheck:
      # /api/me returns 401 without a token; 401 (or 200) proves the server is alive.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/me | grep -qE '401|200'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m

  poller:
    image: ghcr.io/eternally-black/hedge-fun:latest
    command: ["node", "dist/poller.cjs"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
